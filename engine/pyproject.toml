[project]
name = "clipforge"
version = "0.1.0"
description = "Local-only video clip editor engine"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.48",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.4",
  "fonttools>=4.40",
  "opencv-python-headless>=4.10,<5",
  "psutil>=5.9",
]

[project.optional-dependencies]
ml = ["faster-whisper>=1.1", "librosa>=0.10", "soundfile>=0.12"]
gpu = ["nvidia-cublas-cu12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
clipforge-api = "clipforge.api.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["assets/fonts/*", "assets/presets/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: needs a downloaded Whisper model (slow)",
  "gpu: needs a working NVIDIA GPU",
]
addopts = "-q"
