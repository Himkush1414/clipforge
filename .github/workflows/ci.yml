name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install engine
        run: pip install -e "engine[dev,ml]"
      - name: Download CJK caption font
        run: |
          mkdir -p "$HOME/cjk-font"
          curl -fsSL -o "$HOME/cjk-font/NotoSansCJK-Bold.ttc" \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTC/NotoSansCJK-Bold.ttc"
          echo "CLIPFORGE_TEST_CJK_FONT=$HOME/cjk-font/NotoSansCJK-Bold.ttc" >> "$GITHUB_ENV"
      - name: Download face detector model
        run: |
          mkdir -p "$HOME/face-model"
          curl -fsSL -o "$HOME/face-model/face_detection_yunet_2023mar.onnx" \
            "https://github.com/opencv/opencv_zoo/raw/f12e12798e8314f7c074a6656816c048dcc95b7a/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  $HOME/face-model/face_detection_yunet_2023mar.onnx" | sha256sum -c --status
          echo "CLIPFORGE_TEST_YUNET=$HOME/face-model/face_detection_yunet_2023mar.onnx" >> "$GITHUB_ENV"
      - name: Lint
        working-directory: engine
        run: ruff check .
      - name: Types
        working-directory: engine
        run: mypy clipforge
      - name: Tests (no model or GPU)
        working-directory: engine
        # Exit code 5 means no tests were collected, which is fine on a scaffold-only branch.
        env:
          CLIPFORGE_VISUAL_METRICS: ${{ runner.temp }}/visual-metrics.jsonl
        run: pytest -m "not model and not gpu" || [ $? -eq 5 ]
      - name: Keep caption comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-visual
          path: |
            ${{ runner.temp }}/visual-metrics.jsonl
            engine/tests/visual-failures/
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        if: hashFiles('web/package.json') != ''
        run: npm ci
        working-directory: web
      - name: Lint
        if: hashFiles('web/package.json') != ''
        run: npm run lint
        working-directory: web
      - name: Build
        if: hashFiles('web/package.json') != ''
        run: npm run build
        working-directory: web
